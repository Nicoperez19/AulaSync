services:
  # ============================================
  # BASE DE DATOS MARIADB (TODAS LAS BDs)
  # ============================================
  db:
    image: mariadb:10.11
    container_name: aulamanager_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aulamanager_net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  aulamanager_net:
    driver: bridge

volumes:
  db_data:
